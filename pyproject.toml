[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-forge-tui"
version = "0.3.0"
description = "A terminal-native multi-agent coding workstation"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["textual>=1,<9", "pyte>=0.8.2,<0.9", "psutil>=6,<8", "ptyprocess>=0.7,<1; sys_platform != 'win32'"]

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
forge = "forge.__main__:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
