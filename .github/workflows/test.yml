name: terminal-native-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -e '.[mcp,credentials,test]'
      - run: python .github/scripts/run_tests.py
        env:
          FORGE_SANDBOX_TESTS: '1'
      - if: always()
        run: python .github/scripts/ci_report.py --suite linux-${{ matrix.python }}
      - if: always() && github.event_name == 'push'
        run: python .github/scripts/publish_ci.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[mcp,credentials,test]'
      - name: Test native installer
        shell: pwsh
        run: |
          $env:FORGE_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'forge-native-install'
          $env:FORGE_BIN_ROOT = Join-Path $env:RUNNER_TEMP 'forge-native-bin'
          $env:FORGE_CONFIGURE_PATH = '0'
          & ./scripts/install.ps1
          if (-not (Test-Path "$env:FORGE_BIN_ROOT/agent-command.cmd")) { throw 'Launcher missing' }
          "FORGE_WINDOWS_INSTALL_TEST_BIN=$env:FORGE_BIN_ROOT" >> $env:GITHUB_ENV
          "FORGE_WINDOWS_INSTALL_ROOT=$env:FORGE_INSTALL_ROOT" >> $env:GITHUB_ENV
      - name: Validate installed application
        shell: pwsh
        run: |
          $installedPython = Join-Path $env:FORGE_WINDOWS_INSTALL_ROOT 'venv\Scripts\python.exe'
          $launcher = Join-Path $env:FORGE_WINDOWS_INSTALL_TEST_BIN 'agent-command.cmd'
          & $installedPython -I scripts/validate_install.py --launcher $launcher --output installed-check.json
      - run: python .github/scripts/run_tests.py tests/test_windows.py tests/test_store.py tests/test_health.py tests/test_packaging.py -k 'not actual_sandbox and not symlinks'
      - if: always()
        run: python .github/scripts/ci_report.py --suite windows-baseline-${{ matrix.python }}
      - if: always() && github.event_name == 'push'
        run: python .github/scripts/publish_ci.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
  windows-experimental:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[mcp,credentials,test]'
      - name: Probe disposable native security roundtrips
        run: python .github/scripts/windows_security_probe.py
      - run: python .github/scripts/run_tests.py tests/test_windows_isolation.py tests/test_integrations.py tests/test_ruflo_tools.py -k 'not actual_sandbox and not symlinks'
      - if: always()
        run: python .github/scripts/ci_report.py --suite windows-isolation-${{ matrix.python }}
      - if: always() && github.event_name == 'push'
        run: python .github/scripts/publish_ci.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
  ruflo:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python -m pip install -e '.[mcp,test]'
      - name: Install locked upstream runtime
        run: |
          mkdir -p "$RUNNER_TEMP/ruflo"
          cp integrations/ruflo/package*.json "$RUNNER_TEMP/ruflo/"
          npm ci --prefix "$RUNNER_TEMP/ruflo" --no-audit --no-fund
      - run: python .github/scripts/run_tests.py tests/test_integrations.py tests/test_ruflo_tools.py -k actual_ruflo
        env:
          FORGE_RUFLO_TESTS: '1'
          FORGE_RUFLO_FULL_TESTS: '1'
          FORGE_RUFLO_BIN: ${{ runner.temp }}/ruflo/node_modules/.bin/ruflo
      - if: always()
        run: python .github/scripts/ci_report.py --suite ruflo
      - if: always() && github.event_name == 'push'
        run: python .github/scripts/publish_ci.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
