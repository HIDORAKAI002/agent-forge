name: Windows test report
description: Share standard-user Windows installation or terminal evidence.
body:
- type: markdown
  attributes:
    value: Thank you! Use disposable test data. Do not post credentials, private paths,
      recordings or security exploits. See CONTRIBUTING.md and SECURITY.md.
- type: textarea
  id: environment
  attributes:
    label: Environment and exact commit
    description: OS/build, architecture, Python, terminal and commit SHA.
  validations:
    required: true
- type: textarea
  id: details
  attributes:
    label: Reproduction or proposal
    description: Expected vs actual behavior, commands, or proposed scope and acceptance
      criteria.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Redacted evidence
    description: Separate passed, failed and skipped counts. Do not treat discovery
      or mocks as backend acceptance.
